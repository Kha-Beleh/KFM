services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: kfm_ci
      POSTGRES_DB: kfm_ci
      POSTGRES_PASSWORD: ${KFM_CI_DB_PASSWORD:?Set KFM_CI_DB_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kfm_ci -d kfm_ci]
      interval: 3s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
  app:
    image: ${KFM_CI_IMAGE:-kfm-ci:local}
    build: .
    environment:
      KFM_DATABASE_URL: postgres://kfm_ci:${KFM_CI_DB_PASSWORD:?Set KFM_CI_DB_PASSWORD}@db:5432/kfm_ci?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: false
